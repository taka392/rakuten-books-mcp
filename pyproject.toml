[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rakuten-books-mcp"
version = "0.1.0"
description = "MCP server for Rakuten Books Web Service (BooksBook + BooksGenre)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "taka392" }]
keywords = ["mcp", "rakuten", "books", "cursor", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
rakuten-books-mcp = "rakuten_books_mcp.server:main"
rakuten-books-mcp-check = "rakuten_books_mcp.check:main"

[project.urls]
Repository = "https://github.com/taka392/rakuten-books-mcp"

[tool.setuptools.packages.find]
include = ["rakuten_books_mcp*"]
